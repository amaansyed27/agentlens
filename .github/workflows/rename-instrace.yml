name: Rename to Instrace

on:
  push:
    branches: ["rename/instrace"]

permissions:
  contents: write

jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename/instrace
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Rename AgentLens to Instrace
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');

          const files = execFileSync('git', ['ls-files', '-z'])
            .toString('utf8')
            .split('\0')
            .filter(Boolean);

          // Workflow files are updated/deleted separately through the GitHub connector,
          // because the Actions token cannot modify workflows.
          const skip = new Set([
            'docs/rename-inventory.md',
            '.github/workflows/ci.yml',
            '.github/workflows/rename-instrace.yml',
          ]);

          for (const file of files) {
            if (skip.has(file) || !fs.existsSync(file)) continue;
            const buf = fs.readFileSync(file);
            if (buf.includes(0)) continue;
            const text = buf.toString('utf8');
            const renamed = text
              .replaceAll('@agentlens/core', 'instrace-core')
              .replaceAll('AGENTLENS_HOME', 'INSTRACE_HOME')
              .replaceAll('agentlensVersion', 'instraceVersion')
              .replaceAll('AgentLens', 'Instrace')
              .replaceAll('agentlens', 'instrace');
            if (renamed !== text) fs.writeFileSync(file, renamed);
          }

          fs.rmSync('docs/rename-inventory.md', { force: true });

          const readmePath = 'README.md';
          let readme = fs.readFileSync(readmePath, 'utf8');
          readme = readme.replace(
            "**DevTools for your coding agent's context.**",
            '**Trace what instructions your coding agent actually sees.**',
          );
          fs.writeFileSync(readmePath, readme);
          NODE

      - name: Verify public identifiers
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const root = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const cli = JSON.parse(fs.readFileSync('packages/cli/package.json', 'utf8'));
          const core = JSON.parse(fs.readFileSync('packages/core/package.json', 'utf8'));
          if (root.name !== 'instrace-monorepo') throw new Error(`root name: ${root.name}`);
          if (cli.name !== 'instrace') throw new Error(`CLI package: ${cli.name}`);
          if (cli.bin?.instrace !== './dist/index.js') throw new Error('instrace binary missing');
          if (core.name !== 'instrace-core') throw new Error(`core package: ${core.name}`);
          if (cli.dependencies?.['instrace-core'] !== '^0.1.0') throw new Error('CLI core dependency incorrect');
          NODE
          if git grep -n -E 'AgentLens|agentlens|@agentlens/core|AGENTLENS_HOME|agentlensVersion' -- ':!docs/rename-inventory.md' ':!.github/workflows/ci.yml' ':!.github/workflows/rename-instrace.yml'; then
            echo 'Old AgentLens identifiers remain outside workflow files' >&2
            exit 1
          fi

      - name: Clean install and verification
        run: |
          npm ci
          npm run build
          npm run lint
          npm test
          npm run benchmark

      - name: Package smoke test
        shell: bash
        run: |
          rm -rf smoke
          mkdir -p smoke/proj smoke/home smoke/user smoke/consumer
          printf '# Smoke\n\nAlways use pnpm.\n' > smoke/proj/AGENTS.md
          npm pack --workspace instrace-core --pack-destination ./smoke
          npm pack --workspace instrace --pack-destination ./smoke
          CORE_TGZ=$(ls ./smoke/instrace-core-*.tgz)
          CLI_TGZ=$(ls ./smoke/instrace-[0-9]*.tgz)
          npm install --prefix ./smoke/user "$PWD/$CLI_TGZ" "$PWD/$CORE_TGZ" --no-audit --no-fund
          INSTRACE_HOME="$PWD/smoke/home" NO_COLOR=1 ./smoke/user/node_modules/.bin/instrace scan --cwd ./smoke/proj
          INSTRACE_HOME="$PWD/smoke/home" NO_COLOR=1 ./smoke/user/node_modules/.bin/instrace tokens --max 100000 --cwd ./smoke/proj
          cd ./smoke/consumer
          npm init -y > /dev/null
          npm pkg set type=module
          npm install ../instrace-core-*.tgz --no-audit --no-fund
          node --input-type=module -e "import('instrace-core').then(async (m) => { const r = await m.scanProject({ cwd: '../proj' }); if (!r.agents.length) process.exit(1); console.log('consumer ok'); })"

      - name: Commit validated rename
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename project to Instrace"
          git push origin HEAD:rename/instrace
