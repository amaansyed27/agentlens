name: Publish v0.1.0

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type publish-v0.1.0 to confirm the first public release"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'publish-v0.1.0'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify release metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const root = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const core = JSON.parse(fs.readFileSync('packages/core/package.json', 'utf8'));
          const cli = JSON.parse(fs.readFileSync('packages/cli/package.json', 'utf8'));

          const expectedRepo = 'git+https://github.com/amaansyed27/instrace.git';

          if (root.private !== true) throw new Error('workspace root must remain private');
          if (root.version !== '0.1.0') throw new Error(`root version is ${root.version}`);
          if (core.name !== 'instrace-core' || core.version !== '0.1.0') {
            throw new Error(`unexpected core identity: ${core.name}@${core.version}`);
          }
          if (cli.name !== 'instrace' || cli.version !== '0.1.0') {
            throw new Error(`unexpected CLI identity: ${cli.name}@${cli.version}`);
          }
          if (cli.bin?.instrace !== './dist/index.js') throw new Error('instrace CLI binary is missing');
          if (cli.dependencies?.['instrace-core'] !== '^0.1.0') {
            throw new Error('CLI must depend on instrace-core ^0.1.0');
          }
          if (core.repository?.url !== expectedRepo || cli.repository?.url !== expectedRepo) {
            throw new Error('package repository metadata does not match amaansyed27/instrace');
          }
          if (core.publishConfig?.access !== 'public' || cli.publishConfig?.access !== 'public') {
            throw new Error('both packages must publish as public');
          }
          NODE

      - name: Verify registry and package ownership state
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          npm ping

          check_package() {
            local pkg="$1"
            local output_name="$2"
            local expected_repo="git+https://github.com/amaansyed27/instrace.git"

            if npm view "$pkg" name >/dev/null 2>&1; then
              if npm view "$pkg@0.1.0" version >/dev/null 2>&1; then
                local repo
                repo=$(npm view "$pkg@0.1.0" repository.url --json | tr -d '"\r\n')
                if [ "$repo" != "$expected_repo" ]; then
                  echo "::error::$pkg@0.1.0 already exists but does not point to $expected_repo"
                  exit 1
                fi
                echo "$pkg@0.1.0 is already published from this repository; it will be skipped."
                echo "$output_name=true" >> "$GITHUB_OUTPUT"
              else
                echo "::error::$pkg already exists on npm under another release history. Aborting to avoid publishing into an unexpected package."
                exit 1
              fi
            else
              echo "$pkg is available for first publication."
              echo "$output_name=false" >> "$GITHUB_OUTPUT"
            fi
          }

          check_package "instrace-core" "skip_core"
          check_package "instrace" "skip_cli"

      - name: Inspect core tarball
        if: steps.registry.outputs.skip_core != 'true'
        run: npm pack --dry-run --workspace instrace-core

      - name: Inspect CLI tarball
        if: steps.registry.outputs.skip_cli != 'true'
        run: npm pack --dry-run --workspace instrace

      - name: Publish instrace-core
        if: steps.registry.outputs.skip_core != 'true'
        run: npm publish --workspace instrace-core --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish instrace
        if: steps.registry.outputs.skip_cli != 'true'
        run: npm publish --workspace instrace --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm release
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            CORE=$(npm view instrace-core@0.1.0 version 2>/dev/null || true)
            CLI=$(npm view instrace@0.1.0 version 2>/dev/null || true)
            if [ "$CORE" = "0.1.0" ] && [ "$CLI" = "0.1.0" ]; then
              echo "npm release verified: instrace-core@0.1.0 and instrace@0.1.0"
              exit 0
            fi
            sleep 4
          done
          echo "::error::npm did not report both v0.1.0 packages after publishing"
          exit 1

      - name: Create GitHub v0.1.0 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "GitHub release v0.1.0 already exists; leaving it unchanged."
          else
            gh release create v0.1.0 \
              --target "$GITHUB_SHA" \
              --title "Instrace v0.1.0" \
              --notes $'First public release of Instrace.\n\n- Trace the effective instructions and context loaded by OpenCode, Codex, and Claude Code\n- Explain why a path receives specific context\n- Compare harness behavior across agents\n- Detect duplicate and conflicting instructions\n- Estimate context/token usage\n- Local-only: no account, API key, cloud backend, or LLM required\n\nPackages:\n- `instrace` — CLI\n- `instrace-core` — library'
