name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["20", "22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  smoke:
    # Install the packed tarballs (not workspace source) and exercise
    # the CLI plus a library consumer, like a real user would.
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: mkdir -p ./smoke
      - run: npm pack --workspace instrace-core --pack-destination ./smoke
      - run: npm pack --workspace instrace --pack-destination ./smoke
      - run: |
          mkdir -p ./smoke/proj ./smoke/home
          printf '# Smoke\n\nAlways use pnpm.\n' > ./smoke/proj/AGENTS.md
          CORE_TGZ=$(ls ./smoke/instrace-core-*.tgz) && CLI_TGZ=$(ls ./smoke/instrace-[0-9]*.tgz) && \
          npm install --prefix ./smoke/user "$PWD/$CLI_TGZ" "$PWD/$CORE_TGZ" --no-audit --no-fund
          INSTRACE_HOME="$PWD/smoke/home" NO_COLOR=1 ./smoke/user/node_modules/.bin/instrace scan --cwd ./smoke/proj
          INSTRACE_HOME="$PWD/smoke/home" NO_COLOR=1 ./smoke/user/node_modules/.bin/instrace tokens --max 100000 --cwd ./smoke/proj
      - run: |
          mkdir -p ./smoke/consumer
          cd ./smoke/consumer
          npm init -y > /dev/null
          npm pkg set type=module
          npm install ../instrace-core-*.tgz --no-audit --no-fund
          node --input-type=module -e "import('instrace-core').then(async (m) => { const r = await m.scanProject({ cwd: '../proj' }); if (!r.agents.length) process.exit(1); console.log('consumer ok'); })"
